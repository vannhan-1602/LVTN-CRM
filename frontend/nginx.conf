server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router dùng client-side routing — mọi route không khớp file tĩnh phải trả về
    # index.html để React tự xử lý, nếu không refresh trang ở route con (VD /leads/5) sẽ ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache dài hạn cho asset đã có hash trong tên file (Vite tự thêm hash khi build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
